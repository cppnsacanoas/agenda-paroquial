
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agenda Paroquial - Nossa Senhora Aparecida</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f4;
            color: #333;
        }

        header {
            background: #174d37;
            color: white;
            text-align: center;
            padding: 35px 15px;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 26px;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .agenda {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000012;
        }

        iframe {
            display: block;
            width: 100%;
            height: 700px;
            border: 0;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 21px;
            }

            iframe {
                height: 650px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Paróquia Nossa Senhora Aparecida</h1>
    <p>Agenda de atividades paroquiais</p>
</header>

<main>
    <h2>Agenda Paroquial</h2>

    <p>
        Acompanhe as missas, celebrações,
        reuniões e eventos da nossa comunidade.
    </p>

    <div class="agenda">

        <iframe
            src="https://calendar.google.com/calendar/embed?src=cppnsacanoas%40gmail.com&ctz=America%2FSao_Paulo"
            title="Agenda Paroquial"
            frameborder="0"
            scrolling="no">
        </iframe>

    </div>
</main>

<footer>
    Paróquia Nossa Senhora Aparecida
    <br>
    Unidos na fé e na missão!
</footer>

</body>
</html>
